name: C++ CI

on:
  push:
    branches:
      - master
      - boost
      - 'task*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-filesystem-dev libboost-program-options-dev strace dpkg-dev file
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPATCH_VERSION=${{ github.run_number }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target package
      - name: Install and run
        run: |
          sudo dpkg -i build/bayan-0.0.${{ github.run_number }}-Linux.deb
          python3 test_bayan.py /usr/bin/bayan
      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "bayan-0.0.${{ github.run_number }}"
          build/bayan-0.0.${{ github.run_number }}-Linux.deb
          --target "${{ github.sha }}"
          --title "bayan 0.0.${{ github.run_number }}"
          --generate-notes
