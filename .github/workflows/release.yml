name: C++ CI

on:
  push:
    branches:
      - master
      - sfinae
      - 'task*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install doxygen graphviz -y
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPATCH_VERSION=${{ github.run_number }}
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        run: cmake --build build --target package
      - name: Build documentation
        run: doxygen Doxyfile
      - name: Publish documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/html
          force_orphan: true
      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v0.0.${{ github.run_number }}"
          build/print_ip-0.0.${{ github.run_number }}-Linux.deb
          --target "${{ github.sha }}"
          --title "Release 0.0.${{ github.run_number }}"
          --generate-notes
