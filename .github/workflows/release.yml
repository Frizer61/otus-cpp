name: C++ CI

on:
  push:
    branches:
      - master
      - parser
      - 'task*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPATCH_VERSION=${{ github.run_number }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target package
      - name: Install and run
        run: |
          sudo dpkg -i build/bulk-0.0.${{ github.run_number }}-Linux.deb
          printf 'cmd1\ncmd2\ncmd3\n' | bulk 3
      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v0.0.${{ github.run_number }}"
          build/bulk-0.0.${{ github.run_number }}-Linux.deb
          --target "${{ github.sha }}"
          --title "Release 0.0.${{ github.run_number }}"
          --generate-notes
